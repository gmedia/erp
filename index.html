<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />

        <!-- Capacitor/mobile static entry. Mirrors resources/views/app.blade.php for the WebView build. -->
        <script>
            (function () {
                var appearance = 'system';
                if (
                    appearance === 'system' &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches
                ) {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>

        <style>
            html {
                background-color: oklch(1 0 0);
            }
            html.dark {
                background-color: oklch(0.145 0 0);
            }
        </style>

        <script>
            // Neutral placeholder; overridable at build time in a later phase.
            window.__APP_COMPANY_NAME__ = 'ERP';
        </script>

        <title>ERP</title>
    </head>
    <body class="font-sans antialiased">
        <div id="app"></div>
        <script type="module" src="/resources/js/app.tsx"></script>
    </body>
</html>
