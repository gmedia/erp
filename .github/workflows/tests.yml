name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_SAIL_IMAGE: ghcr.io/${{ github.repository }}/ci-sail:8.4

jobs:
  changes:
    name: Affected tests (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      full_pest: ${{ steps.affected.outputs.full_pest }}
      full_e2e: ${{ steps.affected.outputs.full_e2e }}
      pest_groups: ${{ steps.affected.outputs.pest_groups }}
      e2e_dirs: ${{ steps.affected.outputs.e2e_dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: 8.4
          coverage: none

      - name: Mapper self-test
        run: php scripts/ci/affected-tests.php --self-test

      - name: Compute affected tests (shadow)
        id: affected
        continue-on-error: true
        env:
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ vars.CI_FORCE_FULL }}
        run: |
          set -uo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          out full_pest false; out full_e2e false; out pest_groups '[]'; out e2e_dirs '[]'
          full() { out full_pest true; out full_e2e true; echo "Affected-tests: FULL ($1)" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "${FORCE_FULL:-}" = "1" ]; then full "CI_FORCE_FULL=1"; exit 0; fi
          if [ "${SAME_REPO:-}" != "true" ]; then full "fork PR or non-PR event"; exit 0; fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then full "missing base/head sha"; exit 0; fi
          git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA" || true
          git show "$BASE_SHA:scripts/ci/affected-tests.php" > /tmp/affected-tests.php 2>/dev/null || cp scripts/ci/affected-tests.php /tmp/affected-tests.php
          git diff --name-only -M "$BASE_SHA...$HEAD_SHA" > /tmp/changed.txt || true
          php /tmp/affected-tests.php --files /tmp/changed.txt > /tmp/affected.json
          php -r '$d=json_decode(file_get_contents("/tmp/affected.json"),true); foreach(["full_pest","full_e2e"] as $k){echo $k."=".($d[$k]?"true":"false")."\n";} echo "pest_groups=".json_encode($d["pest_groups"])."\n"; echo "e2e_dirs=".json_encode($d["e2e_dirs"])."\n";' >> "$GITHUB_OUTPUT"
          { echo "### Affected tests (shadow, non-blocking)"; echo '```json'; cat /tmp/affected.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  affected-pest-preview:
    name: Affected Pest (shadow, non-blocking)
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.full_pest != 'true' && needs.changes.outputs.pest_groups != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^WWWUSER=.*/WWWUSER=$(id -u)/" .env
          sed -i "s/^WWWGROUP=.*/WWWGROUP=$(id -g)/" .env
          mkdir -p storage/tmp
          chmod -R u+rwX,g+rwX,o-rwx storage/tmp

      - name: Bootstrap Sail dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pull CI Sail image
        shell: bash
        timeout-minutes: 5
        run: |
          branch_tag="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          branch_tag=$(echo "$branch_tag" | tr -cd '[:alnum:]._-')
          candidates=(
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:sha-${GITHUB_SHA::7}"
            "$CI_SAIL_IMAGE"
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:${branch_tag}"
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:latest"
          )
          for image in "${candidates[@]}"; do
            for attempt in 1 2 3; do
              if timeout 60s docker pull "$image"; then
                docker tag "$image" sail-8.4/app
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "CI Sail image $image not available. Retry ${attempt}/3 in 10s..."
                sleep 10
              fi
            done
          done
          echo "::error::Unable to pull any CI Sail image candidate after retries."
          exit 1

      - name: Start Sail
        run: |
          docker volume rm erp_sail-mariadb 2>/dev/null || true
          ./vendor/bin/sail up -d --wait

      - name: Generate application key
        run: ./vendor/bin/sail artisan key:generate

      - name: Run affected Pest groups (non-blocking)
        continue-on-error: true
        env:
          GROUPS_JSON: ${{ needs.changes.outputs.pest_groups }}
        run: |
          set -uo pipefail
          mapfile -t GROUPS < <(php -r '$d=json_decode((string) getenv("GROUPS_JSON"), true) ?: []; foreach ($d as $g) { echo $g, PHP_EOL; }')
          { echo "### Affected Pest (shadow, non-blocking)"; echo "**Groups (${#GROUPS[@]}):** ${GROUPS[*]}"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#GROUPS[@]}" -eq 0 ]; then exit 0; fi
          ARGS=(); for g in "${GROUPS[@]}"; do ARGS+=(--group "$g"); done
          START=$(date +%s)
          ./vendor/bin/sail test "${ARGS[@]}" --colors=never 2>&1 | tee /tmp/affected-pest.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          { echo "**Duration:** $((END-START))s"; echo "**Exit:** $RC"; echo '```'; tail -n 8 /tmp/affected-pest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Stop Sail
        if: always()
        run: ./vendor/bin/sail down 2>&1 | tail -3 || true


  quality:
    name: Quality checks via Sail
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      packages: read
      pull-requests: read
    outputs:
      autofix_applied: ${{ steps.autofix.outputs.changed }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Guard date field schemas
        run: bash scripts/check-date-schemas.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^WWWUSER=.*/WWWUSER=$(id -u)/" .env
          sed -i "s/^WWWGROUP=.*/WWWGROUP=$(id -g)/" .env
          mkdir -p storage/tmp
          chmod -R u+rwX,g+rwX,o-rwx storage/tmp

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Bootstrap Sail dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pull CI Sail image
        shell: bash
        timeout-minutes: 5
        run: |
          branch_tag="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          branch_tag=$(echo "$branch_tag" | tr -cd '[:alnum:]._-')

          candidates=(
            "$CI_SAIL_IMAGE"
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:${branch_tag}"
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:latest"
          )

          for image in "${candidates[@]}"; do
            for attempt in 1 2 3; do
              if timeout 60s docker pull "$image"; then
                docker tag "$image" sail-8.4/app
                exit 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "CI Sail image $image not available. Retry ${attempt}/3 in 10s..."
                sleep 10
              fi
            done
          done

          echo "::error::Unable to pull any CI Sail image candidate after retries."
          exit 1

      - name: Start Sail
        run: |
          docker volume rm erp_sail-mariadb 2>/dev/null || true
          ./vendor/bin/sail up -d --wait

      - name: Capture MariaDB logs on failure
        if: failure()
        run: |
          echo "::group::MariaDB container logs"
          docker logs erp-mariadb-1 2>&1 || true
          echo "::endgroup::"
          echo "::group::All container status"
          docker ps -a 2>&1 || true
          echo "::endgroup::"

      - name: Cache npm dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        run: ./vendor/bin/sail npm ci

      - name: Run Duster
        run: ./vendor/bin/sail bin duster fix --no-interaction

      - name: Format Blade templates
        run: ./vendor/bin/sail npm run blade:formatter

      - name: Format frontend
        run: ./vendor/bin/sail npm run format

      - name: Lint frontend
        run: ./vendor/bin/sail npm run lint

      - name: Auto-commit quality autofixes
        id: autofix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git status --short
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "::error::Lint autofixes are still changing files on the bot rerun."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Lint autofixes were generated, but this PR comes from a fork so CI cannot push them back."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply CI autofixes"

          push_url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$push_url" "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push failed, rebasing and retrying (attempt $attempt/3)..."
              git fetch "$push_url" "$TARGET_BRANCH"
              git rebase "FETCH_HEAD"
            fi
          done
          echo "::warning::Failed to push autofixes after 3 attempts; continuing. Please apply formatting locally."
          exit 0

      - name: Configure MinIO bucket
        if: steps.autofix.outputs.changed != 'true'
        run: |
          ./vendor/bin/sail exec -T minio mc alias set myminio http://localhost:9000 sail password
          ./vendor/bin/sail exec -T minio mc mb myminio/local || true
          ./vendor/bin/sail exec -T minio mc anonymous set download myminio/local || true

      - name: Generate Application Key
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail artisan key:generate

      - name: Clear configuration cache
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail artisan config:clear

      - name: Run PHPStan
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail bin phpstan analyze

      - name: Check TypeScript
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail npm run types

      - name: Check sidebar menu icons
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail npm run check:menu-icons

      - name: Check raw Tailwind colors
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail npm run check:raw-colors

      - name: Build assets
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail npm run build

      - name: Build mobile bundle
        if: steps.autofix.outputs.changed != 'true'
        run: ./vendor/bin/sail npm run build:mobile

      - name: Run tests with coverage
        if: ${{ steps.autofix.outputs.changed != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: ./vendor/bin/sail test --colors=always --coverage-clover=coverage.xml

      - name: Run tests
        if: ${{ steps.autofix.outputs.changed != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: ./vendor/bin/sail test --colors=always

      - name: Setup Java for Sonar scanner
        if: ${{ success() && steps.autofix.outputs.changed != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run SonarQube Cloud scan
        if: ${{ success() && steps.autofix.outputs.changed != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Keep JRE provisioning on: bundled scanner JRE is Java 17 (rejected by SonarCloud).
          args: >
            -Dproject.settings=.sonarcloud.properties
            -Dsonar.organization=gmedia
            -Dsonar.projectKey=gmedia_erp

      - name: Upload failure logs
        if: failure() && steps.autofix.outputs.changed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: laravel-logs-${{ github.run_id }}
          path: storage/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Sail
        if: always()
        run: |
          if [ -x ./vendor/bin/sail ]; then
            ./vendor/bin/sail down -v
          fi

  e2e:
    name: Playwright E2E via Sail (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Parallel with Quality (option b, issue #162): autofixes are formatting-only;
    # `ci` still fails when autofix_applied=true and the follow-up run re-tests.
    # Sharded across runners (issue #183): 4 shards, 129/129/129/128 = 515 tests.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      packages: read
    env:
      PLAYWRIGHT_USE_SAIL: '1'
      PLAYWRIGHT_BASE_URL: http://localhost:82

    steps:
      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^WWWUSER=.*/WWWUSER=$(id -u)/" .env
          sed -i "s/^WWWGROUP=.*/WWWGROUP=$(id -g)/" .env
          # Bypass API/import/export rate limits under parallel Playwright load.
          # AppServiceProvider honors config('app.disable_rate_limiting') via Limit::none().
          # Must live in .env (Sail app process), not only GHA job env.
          echo "DISABLE_RATE_LIMITING=true" >> .env
          mkdir -p storage/tmp
          chmod -R u+rwX,g+rwX,o-rwx storage/tmp

      - name: Bootstrap Sail dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pull CI Sail image
        shell: bash
        timeout-minutes: 5
        run: |
          branch_tag="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          branch_tag=$(echo "$branch_tag" | tr -cd '[:alnum:]._-')

          candidates=(
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:sha-${GITHUB_SHA::7}"
            "$CI_SAIL_IMAGE"
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:${branch_tag}"
            "ghcr.io/${GITHUB_REPOSITORY}/ci-sail:latest"
          )

          for image in "${candidates[@]}"; do
            for attempt in 1 2 3; do
              if timeout 60s docker pull "$image"; then
                docker tag "$image" sail-8.4/app
                exit 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "CI Sail image $image not available. Retry ${attempt}/3 in 10s..."
                sleep 10
              fi
            done
          done

          echo "::error::Unable to pull any CI Sail image candidate after retries."
          exit 1

      - name: Start Sail
        run: |
          docker volume rm erp_sail-mariadb 2>/dev/null || true
          ./vendor/bin/sail up -d --wait

      - name: Capture MariaDB logs on failure
        if: failure()
        run: |
          echo "=== MariaDB Container Logs ==="
          docker logs erp-mariadb-1 2>&1 || echo "Failed to capture MariaDB logs"
          echo "=== All Container Statuses ==="
          docker ps -a

      - name: Cache npm dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies in Sail
        run: ./vendor/bin/sail npm ci

      - name: Install npm dependencies on runner
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Generate application key
        run: ./vendor/bin/sail artisan key:generate

      - name: Run database migrations and seed
        run: ./vendor/bin/sail artisan migrate:fresh --seed --force

      - name: Configure MinIO bucket
        run: |
          ./vendor/bin/sail exec -T minio mc alias set myminio http://localhost:9000 sail password
          ./vendor/bin/sail exec -T minio mc mb myminio/local || true
          ./vendor/bin/sail exec -T minio mc anonymous set download myminio/local || true

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Configure apt retries
        run: echo 'Acquire::Retries "10";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install Playwright browsers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright browser install failed (attempt ${attempt}/3). Retrying in 15s..."
            sudo apt-get clean || true
            sleep 15
          done
          echo "::error::Playwright browser install failed after 3 attempts."
          exit 1

      - name: Run Playwright E2E
        run: |
          mapfile -t DIRS < <(find tests/e2e -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | grep -vxF -f .github/ci/e2e-excluded.txt | sed 's#^#tests/e2e/#')
          if [ "${#DIRS[@]}" -eq 0 ]; then echo "No E2E dirs discovered"; exit 1; fi
          echo "E2E dirs (${#DIRS[@]})"
          npx playwright test "${DIRS[@]}" --shard=${{ matrix.shard }}/4 --reporter=line --retries=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: playwright-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Laravel logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: e2e-laravel-logs-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: storage/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Sail
        if: always()
        run: |
          if [ -x ./vendor/bin/sail ]; then
            ./vendor/bin/sail down -v
          fi

  mobile_android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build mobile bundle and sync Android
        run: npm run mobile:sync

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  mobile_emulator:
    name: Android emulator smoke test (manual, needs KVM)
    needs: mobile_android
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-debug-apk
          path: apk

      - name: Add Android platform tools to PATH
        run: echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Launch emulator and smoke test
        uses: ReactiveCircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -e
            adb install -r apk/app-debug.apk
            adb shell am start -W -n com.contoh.erp/.MainActivity
            sleep 15
            pid="$(adb shell pidof com.contoh.erp | tr -d '\r')"
            if [ -z "$pid" ]; then
              echo "App process is not running after launch"
              exit 1
            fi
            echo "App process pid=$pid"
            adb exec-out screencap -p > android-smoke.png
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              echo "FATAL EXCEPTION detected in logcat"
              exit 1
            fi

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke
          path: android-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: Test suite via Sail
    needs: [quality, e2e, mobile_android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reflect combined CI result
        shell: bash
        run: |
          if [ "${{ needs.quality.outputs.autofix_applied }}" = "true" ]; then
            echo "Autofixes were pushed. The follow-up CI run on the new commit must complete instead." >&2
            exit 1
          fi

          echo "quality=${{ needs.quality.result }} e2e=${{ needs.e2e.result }} mobile=${{ needs.mobile_android.result }}"

          quality_result="${{ needs.quality.result }}"
          e2e_result="${{ needs.e2e.result }}"
          mobile_result="${{ needs.mobile_android.result }}"

          if [[ "$quality_result" == "success" ]]; then
            echo "✅ quality=success"
            quality_passed=true
          else
            echo "❌ quality=$quality_result"
            quality_passed=false
          fi

          if [[ "$e2e_result" == "success" || "$e2e_result" == "skipped" || "$e2e_result" == "cancelled" ]]; then
            echo "✅ e2e=$e2e_result (non-blocking)"
            e2e_passed=true
          else
            echo "❌ e2e=$e2e_result"
            e2e_passed=false
          fi

          if [[ "$mobile_result" == "success" ]]; then
            echo "mobile=$mobile_result"
            mobile_passed=true
          else
            echo "mobile=$mobile_result"
            mobile_passed=false
          fi

          if [[ "$quality_passed" == "true" ]] && [[ "$e2e_passed" == "true" ]] && [[ "$mobile_passed" == "true" ]]; then
            echo "CI=success"
            echo "ci=success" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "CI=failure"
            echo "ci=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
